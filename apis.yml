  - type: OpenAPI
    url: openapi/eventscom-datagol-platform-openapi.yml
  - type: APIReference
    url: https://datagol-be.events.com/swagger-ui/index.html
  - type: Authentication
    url: authentication/eventscom-authentication.yml
  - type: ErrorCatalog
    url: errors/eventscom-problem-types.yml
  - type: DataModel
    url: data-model/eventscom-data-model.yml
  - type: Webhooks
    url: asyncapi/eventscom-webhooks.yml
  - type: Overlay
    url: overlays/eventscom-datagol-platform-overlay.yaml
- name: DataGol AI API
  description: >-
    FastAPI service exposing Events.com's DataGol AI surface — conversations and messages with streaming
    agent runs, a SQL parser and dialect converter, dashboard and widget generation, machine-learning model
    training and prediction, research and PDF export, structured data extraction, knowledge-graph status,
    BI RAG indexing, Jira issue creation, and an MCP tool listing endpoint. 102 operations, OpenAPI 3.1.0.
  humanURL: https://datagol-ai.events.com/docs
  baseURL: https://datagol-ai.events.com/
  tags:
  - artificial-intelligence
  - business-intelligence
  - machine-learning
  - agent-native
  - data-extraction
  - mcp
  properties:
  - type: OpenAPI
    url: openapi/eventscom-datagol-ai-openapi.yml
  - type: APIReference
    url: https://datagol-ai.events.com/docs
  - type: Overlay
    url: overlays/eventscom-datagol-ai-overlay.yaml
- name: DataGol Python Agent API
  description: >-
    FastAPI service running Events.com's sandboxed Python analysis agent — a unified query endpoint, session
    lifecycle and status, stale-session cleanup, streaming run cancellation, Plotly figure retrieval, and
    feedback submission. 10 operations, OpenAPI 3.1.0.
  humanURL: https://datagol-python.events.com/docs
  baseURL: https://datagol-python.events.com/
  tags:
  - artificial-intelligence
  - agent-native
  - data-analysis
  properties:
  - type: OpenAPI
    url: openapi/eventscom-datagol-python-agent-openapi.yml
  - type: APIReference
    url: https://datagol-python.events.com/docs
  - type: Overlay
    url: overlays/eventscom-datagol-python-agent-overlay.yaml
- name: DataGol MCP Server
  description: >-
    Hosted Model Context Protocol server for the DataGol workbook surface, reachable at the /mcp, /sse and
    /messages transport paths. Connections are gated on workspace_id, workbook_id and token query parameters
    or headers, so the live tools/list manifest requires authenticated introspection.
  humanURL: https://datagol-mcp.events.com/
  baseURL: https://datagol-mcp.events.com/
  tags:
  - mcp
  - agent-native
  - data-platform
  properties:
