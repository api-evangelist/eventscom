description: >-
  Events.com is a La Jolla, California event-technology company founded by Mitch Thrower (co-founder of
  Active.com / The Active Network) that operates an end-to-end platform for creating, promoting, selling,
  and discovering events. Its organizer-facing products span ticketing and registration (Sell), digital
  event marketing (Promote), sponsorship management (Sponsor), on-site check-in and execution (Execute),
  analytics (Insights), virtual and hybrid events (Virtual), and an embeddable event calendar, alongside a
  consumer event-discovery destination. Events.com does not publish a public developer program, but its
  internal DataGol / Saasxl AI and data platform exposes three anonymously reachable OpenAPI 3.x contracts
  and a hosted Model Context Protocol server on production hosts, covering no-code data tables, ETL and
  orchestration, BI dashboards, knowledge graphs, custom agents, agent skills, and MCP connectors.
