apis:
- name: DataGol Platform API (Saasxl)
  description: >-
    The Spring Boot backend of Events.com's DataGol data and AI platform, self-documented as "Saasxl-api doc".
    865 operations across 85 controller groups covering no-code database tables (NoCoDb v1/v2/v3), data
    sources and connectors, ETL and data pipelines, DAG orchestration, data quality and lineage, BI pages and
    widgets, alerts and notification history, workflows and triggers, table webhooks, identity (IDP), custom
    agents, agent skills, and MCP connector configuration. Authenticated with a JWT bearer token.
  humanURL: https://datagol-be.events.com/swagger-ui/index.html
  baseURL: https://datagol-be.events.com/
  tags:
  - data-platform
  - business-intelligence
  - no-code
  - etl
  - orchestration
  - workflows
  - agent-native
  - mcp
