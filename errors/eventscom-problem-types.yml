    success: boolean
    version: string
    date: date-time
    data: object
    error:
      schema: '#/components/schemas/ErrorMessage'
      fields:
        statusCode: int32
        requestId: string
        message: object
        details: object
        errorCodes: array of string
  note: >-
    `error.errorCodes[]` is a machine-readable string array and `error.requestId` is a correlation id, but
    Events.com publishes no registry of the code values, so agents cannot branch on them without observation.
- name: FastAPI HTTPValidationError
  api: DataGol AI API, DataGol Python Agent API
