- name: RFC 9457 Problem Details
  api: DataGol Platform API (Saasxl)
  media_type: application/problem+json
  observed_only: true
  note: >-
    Not declared anywhere in the OpenAPI, but the live framework-level 404 handler emits it. Observed at
    GET https://datagol-be.events.com/api-docs -> {"type":"about:blank","title":"Not Found","status":404,
    "detail":"No endpoint GET /api-docs.","instance":"/api-docs"}. This is Spring's default ProblemDetail
    fallback for unrouted requests, not a modelled application error, so the API is NOT RFC 9457 conformant.
