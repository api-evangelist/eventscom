note: >-
  Events.com publishes no error reference page, so this catalog is derived entirely from the harvested OpenAPI
  responses plus one live 404 observed on datagol-be.events.com. Two different error contracts are in play: the
  Spring platform wraps errors in a SaasxlResponseDTO envelope, while the two FastAPI services return the
  standard FastAPI 422 validation shape. Neither is RFC 9457, with one exception noted below.
envelopes:
- name: SaasxlResponseDTO
  api: DataGol Platform API (Saasxl)
  schema: '#/components/schemas/SaasxlResponseDTOObject'
  media_type: '*/*'
