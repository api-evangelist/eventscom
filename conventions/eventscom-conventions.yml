idempotency:
  supported: false
  header: null
  evidence: >-
    Zero Idempotency-Key (or equivalent) parameters or headers across all 977 operations in the three specs.
    Unsafe operations — including POST /workflow/api/v1/run, POST /mcpConnectorAuth/api/v1/tools/execute and the
    ML training/prediction triggers — carry no replay-protection contract, so an agent that retries a timed-out
    write has no defined safety guarantee.
