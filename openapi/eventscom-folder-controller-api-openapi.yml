                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
  /noCo/api/v2/workspaces/{workspaceId}/tables/folders/moveElements:
    post:
      tags:
      - folder-controller
      operationId: moveElements
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveElementsDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
  /noCo/api/v2/workspaces/{workspaceId}/tables/folders/hierarchy:
    get:
      tags:
      - folder-controller
      operationId: getFolderHierarchy
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        schema:
          type: string
          default: WORKSPACE_WORKBOOK
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderDTO'
components:
  schemas:
    ElementLinkDTO:
      type: object
      properties:
        id:
          type: string
        elementType:
          type: string
        elementId:
          type: string
        linkedElementType:
          type: string
        linkedId:
          type: string
    SaasxlResponseDTOObject:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          type: object
    ErrorMessage:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        requestId:
          type: string
        message:
          type: object
        details:
          type: object
        errorCodes:
          type: array
          items:
            type: string
    FolderDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        workspaceId:
          type: string
        parentId:
          type: string
        position:
          type: number
          format: double
        sourceType:
          type: string
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        tableIds:
          type: array
          items:
            type: string
        pageIds:
          type: array
          items:
            type: string
        subFolders:
          type: array
          items:
            $ref: '#/components/schemas/FolderDTO'
    MoveElementsDTO:
      type: object
      properties:
        sourceFolderId:
          type: string
        targetFolderId:
          type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementLinkDTO'
  securitySchemes:
    s_jwt:
      type: http
      description: Jwt Token
      scheme: bearer
      bearerFormat: JWT
