components:
  schemas:
    ThirdPartyFilterConfigDTO:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        defaultValue:
          type: string
        actualValue:
          type: string
    TreeSearchRequestDTO:
      type: object
      properties:
        workbookId:
          type: string
        query:
          type: string
        idColumnId:
          type: string
        parentIdColumnId:
          type: string
        labelColumnId:
          type: string
    BIPageTableDTO:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableDTO'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/WidgetParameterDTO'
    TreeFetchLevelRequestDTO:
      type: object
      properties:
        workbookId:
          type: string
        parentId:
          type: string
        idColumnId:
          type: string
        parentIdColumnId:
          type: string
        labelColumnId:
          type: string
    BIPageDTO:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/UserDTO'
        modifiedBy:
          $ref: '#/components/schemas/UserDTO'
        createDate:
          type: string
          format: date-time
        modiDate:
          type: string
          format: date-time
        id:
          type: string
        config:
          $ref: '#/components/schemas/JsonNode'
        title:
          type: string
        description:
          type: string
        mode:
          type: string
          enum:
          - DRAFT
          - EDIT
          - PUBLISHED
        position:
          type: integer
          format: int32
        workspaceId:
          type: string
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetDTO'
    TreeLeafNodesRequestDTO:
      type: object
      properties:
        workbookId:
          type: string
        pathIds:
          type: array
          items:
            type: string
        idColumnId:
          type: string
        parentIdColumnId:
          type: string
    FilterConfigDTO:
      type: object
      properties:
        columnDTO:
          $ref: '#/components/schemas/ColumnDTO'
        label:
          type: string
        type:
          type: integer
          format: int32
        uuid:
          type: string
        operand:
          type: string
        linkedColumns:
          type: array
          items:
            $ref: '#/components/schemas/LinkedColumnDTO'
        rank:
          type: integer
          format: int32
        options:
          type: array
          items:
            type: string
        sortingOrder:
          type: string
          enum:
          - ASC
          - DESC
    BaseWidgetDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subTitle:
          type: string
    FilterOptionsResponseDTO:
      type: object
      properties:
        filterValues:
          type: object
          additionalProperties:
            type: object
    TreeLeafNodesResponseDTO:
      type: object
      properties:
        leafIds:
          type: array
          items:
            type: string
        warningMessage:
          type: string
    AttachmentSettingsDTO:
      type: object
      properties:
        templateKey:
          type: string
        templateFileName:
          type: string
        outputFileName:
          type: string
    RuleDTO:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        operator:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDTO'
        combinator:
          type: string
        not:
          type: boolean
        valueSource:
          type: string
    JoinRequest:
      type: object
      properties:
        workspaceId:
          type: string
        name:
          type: string
        primaryTableId:
          type: string
        joinConditions:
          type: array
          items:
            $ref: '#/components/schemas/JoinConditionDTO'
    TreeSearchResultDTO:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/TreeNodeDTO'
        pathSegments:
          type: array
          items:
            type: string
        pathLabel:
          type: string
    FilterValueDTO:
      type: object
      properties:
        operand:
          type: string
          enum:
          - EQUALS
          - NOT_EQUALS
          - GREATER_THAN
          - GREATER_THAN_EQUALS
          - LESS_THAN
          - LESS_THAN_EQUALS
          - BETWEEN
          - PERCENTAGE_CHANGE
          - ABSOLUTE_CHANGE
          - PERCENTAGE_INCREASE_BY
          - PERCENTAGE_DECREASE_BY
          - IN
          - NOT_IN
          - CONTAINS
          - DOES_NOT_CONTAINS
          - NOT_BETWEEN
          - STARTS_WITH
        value:
          type: object
        expression:
          type: string
    NavigationStackItemDTO:
      type: object
      properties:
        nodeId:
          type: string
        label:
          type: string
    EnumOptionValue:
      type: object
      properties:
        value:
          type: object
        label:
          type: string
    WidgetDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subTitle:
          type: string
        type:
          type: string
          enum:
          - CHART
          - TABLE
          - PIVOT_TABLE
          - KPI
          - TEXT
          - METRICS
          - GEO_MAP
          - WORKBOOK_VIEW
          - COHORT
        config:
          $ref: '#/components/schemas/JsonNode'
        tableId:
          type: string
        viewId:
          type: string
        message:
          type: string
        table:
          $ref: '#/components/schemas/TableDTO'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/BaseWidgetDTO'
        modiDate:
          type: string
          format: date-time
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/WidgetParameterDTO'
        indexStatus:
          type: string
    ViewDTO:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/UserDTO'
        modifiedBy:
          $ref: '#/components/schemas/UserDTO'
        createDate:
          type: string
          format: date-time
        modiDate:
          type: string
          format: date-time
        id:
          type: string
        isMaster:
          type: boolean
        tableId:
          type: string
        position:
          type: number
          format: double
        name:
          type: string
        type:
          type: string
        description:
          type: string
        filterOptions:
          $ref: '#/components/schemas/FilterOptionDTO'
        groupOptions:
          type: array
          items:
            $ref: '#/components/schemas/GroupOptionDTO'
        sortOptions:
          type: array
          items:
            $ref: '#/components/schemas/SortOptionDTO'
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        filterParams:
          type: object
          additionalProperties:
            type: object
        whereClause:
          type: string
        query:
          type: string
        tableName:
          type: string
    TreeLevelDTO:
      type: object
      properties:
        parentId:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TreeNodeDTO'
    ColumnSettingsDTO:
      type: object
      properties:
        enableUserAddNotifications:
          type: boolean
        aiSettings:
          $ref: '#/components/schemas/AIGenerateSettingsDTO'
        attachmentSettings:
          $ref: '#/components/schemas/AttachmentSettingsDTO'
    JoinConditionDTO:
      type: object
      properties:
        targetTableId:
          type: string
        joinConditionExpression:
          type: string
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        selectedColumnIds:
          type: array
          items:
            type: string
    TableDTO:
      type: object
      properties:
        createdBy:
          $ref: '#/components/schemas/UserDTO'
        modifiedBy:
          $ref: '#/components/schemas/UserDTO'
        createDate:
          type: string
          format: date-time
        modiDate:
          type: string
          format: date-time
        id:
          type: string
        workspaceId:
          type: string
        position:
          type: number
          format: double
        tableName:
          type: string
        description:
          type: string
        tableType:
          type: string
          enum:
          - STATIC
          - DYNAMIC
          - HYBRID
        materializedViewId:
          type: integer
          format: int64
        materializedViewQuery:
          type: string
        sourceType:
          type: string
        storageType:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDTO'
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        requestId:
          type: string
        status:
          type: string
        connectionName:
          type: string
        systemTableName:
          type: string
        companyId:
          type: integer
          format: int64
        pipelineId:
          type: integer
          format: int64
        allowSwitchStorage:
          type: boolean
        dataProvider:
          type: string
          enum:
          - JDBC
          - SPARK
          - ATHENA
          - SNOWFLAKE
          - BIGQUERY
          - MYSQL
