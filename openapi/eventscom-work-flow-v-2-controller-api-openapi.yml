        contentType:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParametersDTO'
    RuleDTO:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        operator:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDTO'
        combinator:
          type: string
        not:
          type: boolean
        valueSource:
          type: string
    ParametersDTO:
      type: object
      properties:
        type:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    WorkFlowExecutionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wfId:
          type: integer
          format: int64
