          type: string
        status:
          type: string
        requestId:
          type: string
        startTimeInMillis:
          type: integer
          format: int64
        endTimeInMillis:
          type: integer
          format: int64
        nodeExecutions:
          type: array
          items:
            $ref: '#/components/schemas/WorkFlowNodeExecutionDTO'
    Config:
      type: object
      properties:
        type:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    WorkFlowTriggerDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userWorkFlowId:
          type: integer
          format: int64
