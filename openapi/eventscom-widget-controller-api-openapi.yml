        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
