  /noCo/api/v2/workspaces/templates:
    get:
      tags:
      - workspace-template-controller
      operationId: getTemplates
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
      - name: entityType
        in: query
        required: true
        schema:
          type: string
      - name: entityId
