      tags:
      - workspace-template-controller
      operationId: updateTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceTemplateDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
