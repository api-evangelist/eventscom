components:
  schemas:
    AnnotationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - CLASSIFICATION
          - GLOSSARY
          - GLOSSARY_TERM
          - TERM
        parentAnnotationId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        uiMetadata:
          type: object
          additionalProperties:
            type: object
    ThirdPartyFilterConfigDTO:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean
        defaultValue:
          type: string
        actualValue:
          type: string
    KeyInfoDTO:
      type: object
      properties:
        primaryKeyName:
          type: string
        primaryKeyTableName:
          type: string
        primaryKeyColumnName:
          type: string
        foreignKeyName:
          type: string
        foreignKeyTableName:
          type: string
        foreignKeyColumnName:
          type: string
        keySequence:
          type: string
        updateRule:
          type: string
        deleteRule:
          type: string
    QuartzJobDTO:
      type: object
      properties:
        id:
          type: string
        creator:
          $ref: '#/components/schemas/Creator'
        triggerInfo:
          $ref: '#/components/schemas/TriggerInfo'
    CatalogDTO:
      type: object
      properties:
        name:
          type: string
    DataPipelineStreamCursorDTO:
      type: object
      properties:
        cursorName:
          type: string
        cursorDataType:
          type: string
        cursorLastValue:
          type: string
    DataSourceSchemaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dataSourceId:
          type: integer
          format: int64
        data:
          $ref: '#/components/schemas/DataSourceSchemaWrapperDTO'
        hash:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
    KeyDTO:
      type: object
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/KeyInfoDTO'
    TriggerInfo:
      type: object
      properties:
        cronExpression:
          type: string
        previousFireTime:
          type: string
          format: date-time
        nextFireTime:
          type: string
          format: date-time
        timeZone:
          type: string
    LinkRecordDTO:
      type: object
      properties:
        sourceRecordId:
          type: object
        destinationRecordId:
          type: object
        linkColumnId:
          type: string
        columnId:
          type: string
        tableId:
          type: string
        companyId:
          type: integer
          format: int64
    PageDTO:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        totalNumberOfRecords:
          type: integer
          format: int64
        totalNumberOfPages:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowDataDTO'
        tableName:
          type: string
        lastCursorValues:
          type: object
          additionalProperties:
            type: object
        isLastPage:
          type: boolean
        waitTime:
          type: integer
          format: int64
        executionTime:
          type: integer
          format: int64
        operationId:
          type: string
        finalQuery:
          type: string
    DataPipelineJobProcessDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pipelineProcessId:
          type: integer
          format: int64
        query:
          type: string
        status:
          type: string
        rank:
          type: integer
          format: int32
        processName:
          type: string
        processType:
          type: string
          enum:
          - PRE
          - POST
    DataPipelineJobLiteDTO:
      type: object
      properties:
        pipelineInfo:
          $ref: '#/components/schemas/DataPipelineInfoDTO'
        job:
          $ref: '#/components/schemas/DataPipelineJobDTO'
        jobV2:
          $ref: '#/components/schemas/DataPipelineJobV2DTO'
    AttachmentSettingsDTO:
      type: object
      properties:
        templateKey:
          type: string
        templateFileName:
          type: string
        outputFileName:
          type: string
    DataPipelineNodeGroupConfig:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numberOfExecutors:
          type: integer
          format: int32
    RuleDTO:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        operator:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDTO'
        combinator:
          type: string
        not:
          type: boolean
        valueSource:
          type: string
    DataPipelineJobDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        jobGroupId:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - STARTED
          - FAILED
          - CANCELLED
          - COMPLETED
          - PENDING
          - RUNNING
          - INCOMPLETE
          - SUCCEEDED
          - DELETED
          - UNKNOWN
          - PRE_VALIDATION_FAILED
          - POST_VALIDATION_FAILED
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        startedBy:
          $ref: '#/components/schemas/UserDTO'
        cancelledBy:
          $ref: '#/components/schemas/UserDTO'
        parentId:
          type: integer
          format: int64
        totalStats:
          type: string
        failureReason:
          type: string
        streams:
          type: array
          items:
            $ref: '#/components/schemas/DataPipelineJobStreamDTO'
        processes:
          type: array
          items:
            $ref: '#/components/schemas/DataPipelineJobProcessDTO'
        sparkJobInfo:
          type: array
          items:
            $ref: '#/components/schemas/SparkJobDataDTO'
        parameters:
          type: object
          additionalProperties:
            type: object
        nodeGroupConfig:
          type: object
