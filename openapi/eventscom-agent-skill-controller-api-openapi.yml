        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AgentSkillDTO'
      security:
      - s_jwt: []
    put:
      tags:
      - agent-skill-controller
      operationId: updateSkill
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSkillDTO'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '503':
          description: Service Unavailable
          content:
            '*/*':
