        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
      security:
      - s_jwt: []
  /skills/api/v1/{skillId}/upload:
    put:
      tags:
      - agent-skill-controller
      operationId: updateSkillMarkdown
      parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: description
        in: query
        required: false
        schema:
          type: string
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      - name: s3Prefix
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
