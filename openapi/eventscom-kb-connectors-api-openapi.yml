      tags:
      - KB Connectors
      summary: List KB connectors created by the current user
      operationId: listConnectors_1
      parameters:
      - name: sourceId
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - GMAIL
          - GOOGLE_DRIVE
          - GOOGLE_SPACES
          - WEB
          - S3
          - GCS
          - AZURE_BLOB
          - ONEDRIVE
          - SHAREPOINT
          - SLACK
          - CONFLUENCE
          - JIRA
          - WORKBOOK
          - WORKSPACE_DOCUMENTS
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
