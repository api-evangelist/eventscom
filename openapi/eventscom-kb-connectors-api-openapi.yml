components:
  schemas:
    PageResponseDTOKbRunDTO:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KbRunDTO'
    KbRunDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        runType:
          type: string
          enum:
          - FULL
          - INCREMENTAL
          - MANUAL
          - REINDEX
        status:
          type: string
          enum:
          - RUNNING
          - SUCCESS
          - FAILED
          - PARTIAL
          - CANCELLED
        temporalWorkflowId:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
        statsJson:
          type: object
          additionalProperties:
            type: object
        checkpointJson:
          type: object
          additionalProperties:
            type: object
    KbConfigDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        credentialId:
          type: integer
          format: int64
        credentialName:
          type: string
        credentialStatus:
          type: string
        syncJson:
          type: object
          additionalProperties:
            type: object
        filtersJson:
          type: object
          additionalProperties:
            type: object
        scheduleJson:
          type: object
          additionalProperties:
            type: object
        indexJson:
          type: object
          additionalProperties:
            type: object
        advancedJson:
          type: object
          additionalProperties:
            type: object
    KbBrowseResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KbBrowseItemDTO'
        hasMore:
          type: boolean
        totalCount:
          type: integer
          format: int32
        nextCursor:
          type: string
    KbConnectorDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - GMAIL
          - GOOGLE_DRIVE
          - GOOGLE_SPACES
          - WEB
          - S3
          - GCS
          - AZURE_BLOB
          - ONEDRIVE
          - SHAREPOINT
          - SLACK
          - CONFLUENCE
          - JIRA
          - WORKBOOK
          - WORKSPACE_DOCUMENTS
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ERROR
        lastSyncAt:
          type: string
          format: date-time
        lastSyncStatus:
          type: string
        sourceId:
          type: string
        credentialId:
          type: integer
          format: int64
        activeConfig:
          $ref: '#/components/schemas/KbConfigDTO'
        latestRun:
          $ref: '#/components/schemas/KbRunDTO'
        stats:
          $ref: '#/components/schemas/KbConnectorStatsDTO'
    KbResolveUrlRequestDTO:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
    PageResponseDTOKbRecordDTO:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KbRecordDTO'
    KbResolveUrlItemDTO:
      type: object
      properties:
        url:
          type: string
        id:
          type: string
        name:
          type: string
        type:
          type: string
        driveId:
          type: string
        error:
          type: string
    KbBrowseItemDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        hasChildren:
          type: boolean
    KbRecordDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connectorId:
          type: string
          format: uuid
        recordGroupId:
          type: string
          format: uuid
        recordGroupName:
          type: string
        externalRecordId:
          type: string
        sourceType:
          type: string
          enum:
          - GMAIL
          - GOOGLE_DRIVE
          - GOOGLE_SPACES
          - WEB
          - S3
          - GCS
          - AZURE_BLOB
          - ONEDRIVE
          - SHAREPOINT
          - SLACK
          - CONFLUENCE
