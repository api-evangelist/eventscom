components:
  schemas:
    WaitNodeContext:
      type: object
      properties:
        waitTimeInSeconds:
          type: integer
          format: int64
    UserWorkFlowHistoryDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        workspaceId:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/WorkFlowHistory'
    RuleDTO:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        operator:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDTO'
        combinator:
          type: string
        not:
          type: boolean
        valueSource:
          type: string
    WorkFlowTriggerDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userWorkFlowId:
          type: integer
          format: int64
        tableId:
          type: string
        tableName:
          type: string
        types:
          type: array
          items:
            type: string
        triggerName:
          type: string
        rule:
          $ref: '#/components/schemas/RuleDTO'
        columns:
          type: array
          items:
            type: string
    ConnectionDTO:
      type: object
      properties:
        node:
          type: string
        nextNodes:
          type: array
          items:
            type: string
    NodeDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nodeType:
          type: string
        relationToPreviousNode:
          type: string
        rule:
          $ref: '#/components/schemas/RuleDTO'
        ifNodeContext:
          $ref: '#/components/schemas/IFNodeContext'
        triggerNodeContext:
          $ref: '#/components/schemas/WorkFlowTriggerDTO'
        waitNodeContext:
          $ref: '#/components/schemas/WaitNodeContext'
        connectorInfo:
          $ref: '#/components/schemas/ConnectorInfoDTO'
        status:
          type: string
        startTimeInMillis:
          type: integer
          format: int64
        endTimeInMillis:
          type: integer
          format: int64
        specificType:
          type: string
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        dataContext:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
    WorkFlowNodeExecutionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        startTimeInMillis:
          type: integer
          format: int64
        endTimeInMillis:
          type: integer
          format: int64
    TriggerDTO:
      type: object
      properties:
        name:
          type: string
        tableId:
          type: string
        tableName:
          type: string
        data:
          type: object
        subscribeURL:
          type: string
    Rule:
      type: object
      properties:
        field:
          type: string
        value:
          type: object
        operator:
          type: string
        combinator:
          type: string
        not:
          type: boolean
        valueSource:
          type: string
    Config:
      type: object
      properties:
        type:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    WorkFlowExecutionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wfId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        requestId:
          type: string
        startTimeInMillis:
          type: integer
          format: int64
        endTimeInMillis:
          type: integer
          format: int64
        nodeExecutions:
          type: array
          items:
            $ref: '#/components/schemas/WorkFlowNodeExecutionDTO'
    WorkFlowDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        companyId:
          type: integer
          format: int64
        createdBy:
          type: string
        currentNode:
          type: string
        destinationNode:
          type: string
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionDTO'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeDTO'
        uiMetadata:
          type: object
          additionalProperties:
            type: object
        dataContext:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        workspaceId:
          type: string
    CredentialDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - QUERY_PARAM
          - BASIC_AUTH
          - AUTHORIZATION
          - ACCESS_TOKEN
          - BEARER
          - API_KEY
          - OAUTH2
        config:
          type: array
          items:
            $ref: '#/components/schemas/Config'
    ConnectorInfoDTO:
      type: object
      properties:
        baseUrl:
          type: string
        connectorType:
          type: string
        path:
          type: string
        method:
          type: string
        credential:
          $ref: '#/components/schemas/CredentialDTO'
        configJsFn:
          type: string
        contentType:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParametersDTO'
    WorkFlowHistory:
      type: object
      properties:
        workFlowId:
          type: integer
          format: int64
        workFlowTitle:
          type: string
        workFlowDesc:
          type: string
        createdBy:
          type: string
        workFlowStatus:
          type: string
        lastTimeExecutedAt:
          type: integer
          format: int64
        workFlowExecutionStatus:
          type: string
        createdAt:
          type: integer
          format: int64
        requestId:
          type: string
    ParametersDTO:
      type: object
      properties:
        type:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    WorkFlowResponseDTO:
      type: object
      properties:
        requestId:
          type: string
    SaasxlResponseDTOWorkFlowResponseDTO:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          $ref: '#/components/schemas/WorkFlowResponseDTO'
    SaasxlResponseDTOWorkFlowExecutionDTO:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          $ref: '#/components/schemas/WorkFlowExecutionDTO'
    IFNodeContext:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    ErrorMessage:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        requestId:
          type: string
        message:
          type: object
        details:
          type: object
        errorCodes:
          type: array
          items:
            type: string
    SaasxlResponseDTOObject:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          type: object
    SaasxlResponseDTOUserWorkFlowHistoryDTO:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          $ref: '#/components/schemas/UserWorkFlowHistoryDTO'
    SaasxlResponseDTOWorkFlowDTO:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          $ref: '#/components/schemas/WorkFlowDTO'
  securitySchemes:
    s_jwt:
      type: http
      description: Jwt Token
      scheme: bearer
      bearerFormat: JWT
