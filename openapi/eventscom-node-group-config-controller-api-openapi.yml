      - node-group-config-controller
      operationId: getValue
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: isDedicatedPoolRequest
        in: query
        required: false
