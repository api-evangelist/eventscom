          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InviteInfoDTO'
      security:
      - s_jwt: []
  /noCo/api/v2/elementPermissions/checkAccess/{elementType}/{elementId}:
    get:
      tags:
      - Element Permissions
      summary: Check user access to element
      description: Check if the logged-in user has access to a specific element. Returns 200 if access granted, 403 if denied
      operationId: checkUserAccess
      parameters:
      - name: elementType
        in: path
        required: true
        schema:
          type: string
      - name: elementId
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
      security:
      - s_jwt: []
  /noCo/api/v2/elementPermissions/checkAccess/{elementType}/{elementId}/{permission}:
    get:
      tags:
      - Element Permissions
      summary: Check user access to element with required permission
      description: Check if the logged-in user has at least the specified permission level (CREATOR, EDITOR, VIEWER) for a specific element. Returns 200 if access granted, 403 if denied
      operationId: checkUserAccessWithPermission
      parameters:
      - name: elementType
        in: path
        required: true
        schema:
          type: string
      - name: elementId
        in: path
        required: true
        schema:
          type: string
      - name: permission
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
      security:
      - s_jwt: []
components:
  schemas:
    BulkCreateRequestDTO:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ElementPermissionsDTO'
    ElementPermissionsDTO:
      required:
      - elementId
      - elementType
      type: object
      properties:
        id:
          type: string
        elementId:
          type: string
        elementType:
          type: string
        permission:
          type: string
        email:
          type: string
        userId:
          type: integer
          format: int64
        anonymousUserId:
          type: string
        user:
          $ref: '#/components/schemas/UserDTO'
        elementName:
          type: string
        companyId:
          type: integer
          format: int64
        parentElementType:
          type: string
        parentElementId:
          type: string
        accessScope:
          type: string
        config:
          type: object
          additionalProperties:
            type: object
        joinedAt:
          type: string
          format: date-time
        element:
          type: object
        hidden:
          type: boolean
    SaasxlResponseDTOObject:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          type: object
    BulkOperationResponseDTO:
      type: object
      properties:
        successfulOperations:
          type: array
          items:
            $ref: '#/components/schemas/ElementPermissionsDTO'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BulkOperationFailureDTO'
        totalProcessed:
          type: integer
          format: int32
        successCount:
          type: integer
          format: int32
        failureCount:
          type: integer
          format: int32
    LinkAccessResponseDTO:
      type: object
      properties:
        scope:
          type: string
        permission:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        companyName:
          type: string
        companyId:
          type: integer
          format: int64
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          uniqueItems: true
          type: array
          items:
            type: string
        joinDate:
          type: string
          format: date-time
        mfaEnabled:
          type: boolean
        redirectToMfaFlow:
          type: boolean
        tokenExpiryTime:
          type: integer
          format: int64
        isServiceAccount:
          type: boolean
        lastLogin:
          type: string
          format: date-time
        signInMethod:
          type: string
          enum:
          - EMAIL
          - GOOGLE
          - MICROSOFT
        isOnboardingCompleted:
          type: boolean
        role:
          type: string
        department:
          type: string
        anonymousUserId:
          type: string
        thirdPartyUser:
          type: boolean
    ErrorMessage:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        requestId:
          type: string
        message:
          type: object
        details:
          type: object
        errorCodes:
          type: array
          items:
            type: string
    LinkAccessRequestDTO:
      required:
      - scope
      type: object
      properties:
        scope:
          type: string
        permission:
          type: string
    InviteInfoDTO:
      type: object
      properties:
        inviteeEmail:
          type: string
        inviterName:
          type: string
        elementName:
          type: string
        elementType:
          type: string
        elementId:
          type: string
        isInviteValid:
          type: boolean
    EditElementPermissionsDTO:
      required:
      - permission
      type: object
      properties:
        id:
          type: string
        permission:
          type: string
        config:
          type: object
          additionalProperties:
            type: object
    BulkOperationFailureDTO:
      type: object
      properties:
        id:
          type: string
        userId:
          type: integer
          format: int64
        reason:
          type: string
    BulkDeleteRequestDTO:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
  securitySchemes:
    s_jwt:
      type: http
      description: Jwt Token
      scheme: bearer
      bearerFormat: JWT
