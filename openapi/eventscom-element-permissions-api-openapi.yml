      summary: Bulk delete element permissions
      description: Delete multiple permissions and return failed deletions
      operationId: bulkDeleteElementPermissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequestDTO'
