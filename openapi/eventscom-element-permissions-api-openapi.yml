        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementPermissionsDTO'
      security:
      - s_jwt: []
  /noCo/api/v2/elementPermissions/{elementType}/{elementId}:
    get:
      tags:
      - Element Permissions
      summary: Get element permissions
      description: Get all permissions for a specific element
      operationId: getElementPermissions
      parameters:
      - name: elementType
        in: path
        required: true
        schema:
          type: string
      - name: elementId
        in: path
        required: true
        schema:
          type: string
      - name: parentElementType
        in: query
        required: false
        schema:
          type: string
      - name: parentElementId
        in: query
        required: false
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                - $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '403':
