    UsageMetadata:
      properties:
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
        total_tokens:
          type: integer
          title: Total Tokens
        input_token_details:
          $ref: '#/components/schemas/InputTokenDetails'
        output_token_details:
          $ref: '#/components/schemas/OutputTokenDetails'
      additionalProperties: true
      type: object
      required:
      - input_tokens
      - output_tokens
      - total_tokens
      title: UsageMetadata
      description: "Usage metadata for a message, such as token counts.\n\nThis is a standard representation\
        \ of token usage that is consistent across models.\n\nExample:\n    ```python\n    {\n       \
        \ \"input_tokens\": 350,\n        \"output_tokens\": 240,\n        \"total_tokens\": 590,\n  \
        \      \"input_token_details\": {\n            \"audio\": 10,\n            \"cache_creation\"\
        : 200,\n            \"cache_read\": 100,\n        },\n        \"output_token_details\": {\n  \
        \          \"audio\": 10,\n            \"reasoning\": 200,\n        },\n    }\n    ```\n\n!!!\
        \ warning \"Behavior changed in `langchain-core` 0.3.9\"\n\n    Added `input_token_details` and\
        \ `output_token_details`.\n\n!!! note \"LangSmith SDK\"\n\n    The LangSmith SDK also has a `UsageMetadata`\
        \ class. While the two share fields,\n    LangSmith's `UsageMetadata` has additional fields to\
        \ capture cost information\n    used by the LangSmith platform."
