components:
  schemas:
    SystemMessageChunk:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: SystemMessageChunk
          title: Type
          default: SystemMessageChunk
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      additionalProperties: true
      type: object
      required:
      - content
      title: SystemMessageChunk
      description: System Message chunk.
    AIMessage:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: ai
          title: Type
          default: ai
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          type: array
          title: Tool Calls
        invalid_tool_calls:
          items:
            $ref: '#/components/schemas/InvalidToolCall'
          type: array
          title: Invalid Tool Calls
        usage_metadata:
          anyOf:
          - $ref: '#/components/schemas/UsageMetadata'
          - type: 'null'
      additionalProperties: true
      type: object
      required:
      - content
      title: AIMessage
      description: 'Message from an AI.


        An `AIMessage` is returned from a chat model as a response to a prompt.


        This message represents the output of the model and consists of both

        the raw output as returned by the model and standardized fields

        (e.g., tool calls, usage metadata) added by the LangChain framework.'
    RequestBodyDeleteMessagesApi:
      properties:
        thread_id:
          type: string
          title: Thread Id
          description: Thread ID of the chat, used in the checkpointer to find the conversation
        message_ids:
          items:
            type: string
          type: array
          title: Message Ids
          description: List of message ids to delete
      type: object
      required:
      - thread_id
      - message_ids
      title: RequestBodyDeleteMessagesApi
    ToolMessage:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: tool
          title: Type
          default: tool
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        tool_call_id:
          type: string
          title: Tool Call Id
        artifact:
          title: Artifact
        status:
          type: string
          enum:
          - success
          - error
          title: Status
          default: success
      additionalProperties: true
      type: object
      required:
      - content
      - tool_call_id
      title: ToolMessage
      description: "Message for passing the result of executing a tool back to a model.\n\n`ToolMessage`\
        \ objects contain the result of a tool invocation. Typically, the result\nis encoded inside the\
        \ `content` field.\n\n`tool_call_id` is used to associate the tool call request with the tool\
        \ call\nresponse. Useful in situations where a chat model is able to request multiple tool\ncalls\
        \ in parallel.\n\nExample:\n    A `ToolMessage` representing a result of `42` from a tool call\
        \ with id\n\n    ```python\n    from langchain_core.messages import ToolMessage\n\n    ToolMessage(content=\"\
        42\", tool_call_id=\"call_Jja7J89XsjrOLA5r!MEOW!SL\")\n    ```\n\nExample:\n    A `ToolMessage`\
        \ where only part of the tool output is sent to the model\n    and the full output is passed in\
        \ to artifact.\n\n    ```python\n    from langchain_core.messages import ToolMessage\n\n    tool_output\
        \ = {\n        \"stdout\": \"From the graph we can see that the correlation between \"\n     \
        \   \"x and y is ...\",\n        \"stderr\": None,\n        \"artifacts\": {\"type\": \"image\"\
        , \"base64_data\": \"/9j/4gIcSU...\"},\n    }\n\n    ToolMessage(\n        content=tool_output[\"\
        stdout\"],\n        artifact=tool_output,\n        tool_call_id=\"call_Jja7J89XsjrOLA5r!MEOW!SL\"\
        ,\n    )\n    ```"
    HumanMessage:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: human
          title: Type
          default: human
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      additionalProperties: true
      type: object
      required:
      - content
      title: HumanMessage
      description: "Message from the user.\n\nA `HumanMessage` is a message that is passed in from a user\
        \ to the model.\n\nExample:\n    ```python\n    from langchain_core.messages import HumanMessage,\
        \ SystemMessage\n\n    messages = [\n        SystemMessage(content=\"You are a helpful assistant!\
        \ Your name is Bob.\"),\n        HumanMessage(content=\"What is your name?\"),\n    ]\n\n    #\
        \ Instantiate a chat model and invoke it with the messages\n    model = ...\n    print(model.invoke(messages))\n\
        \    ```"
    ChatMessage:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: chat
          title: Type
          default: chat
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        role:
          type: string
          title: Role
      additionalProperties: true
      type: object
      required:
      - content
      - role
      title: ChatMessage
      description: Message that can be assigned an arbitrary speaker (i.e. role).
    OutputTokenDetails:
      properties:
        audio:
          type: integer
          title: Audio
        reasoning:
          type: integer
          title: Reasoning
      additionalProperties: true
      type: object
      title: OutputTokenDetails
      description: "Breakdown of output token counts.\n\nDoes *not* need to sum to full output token count.\
        \ Does *not* need to have all keys.\n\nExample:\n    ```python\n    {\n        \"audio\": 10,\n\
        \        \"reasoning\": 200,\n    }\n    ```\n\nMay also hold extra provider-specific keys.\n\n\
        !!! version-added \"Added in `langchain-core` 0.3.9\""
    ToolCallChunk:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        args:
          anyOf:
          - type: string
          - type: 'null'
          title: Args
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Index
        type:
          type: string
          const: tool_call_chunk
          title: Type
      additionalProperties: true
      type: object
      required:
      - name
      - args
      - id
      - index
      title: ToolCallChunk
      description: "A chunk of a tool call (yielded when streaming).\n\nWhen merging `ToolCallChunk` objects\
        \ (e.g., via `AIMessageChunk.__add__`), all\nstring attributes are concatenated. Chunks are only\
        \ merged if their values of\n`index` are equal and not `None`.\n\nExample:\n```python\nleft_chunks\
        \ = [ToolCallChunk(name=\"foo\", args='{\"a\":', index=0)]\nright_chunks = [ToolCallChunk(name=None,\
        \ args=\"1}\", index=0)]\n\n(\n    AIMessageChunk(content=\"\", tool_call_chunks=left_chunks)\n\
        \    + AIMessageChunk(content=\"\", tool_call_chunks=right_chunks)\n).tool_call_chunks == [ToolCallChunk(name=\"\
        foo\", args='{\"a\":1}', index=0)]\n```"
    RequestBodyRunApi:
      properties:
        thread_id:
          type: string
          title: Thread Id
          description: Thread ID of the chat, used in the checkpointer to find the conversation
        message:
          anyOf:
          - $ref: '#/components/schemas/SimpleMessage'
          - type: 'null'
          description: Message object
      type: object
      required:
      - thread_id
      - message
      title: RequestBodyRunApi
    ChatMessageChunk:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: ChatMessageChunk
          title: Type
          default: ChatMessageChunk
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        role:
          type: string
          title: Role
      additionalProperties: true
      type: object
      required:
      - content
      - role
      title: ChatMessageChunk
      description: Chat Message chunk.
    AIMessageChunk:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: AIMessageChunk
          title: Type
          default: AIMessageChunk
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          type: array
          title: Tool Calls
        invalid_tool_calls:
          items:
            $ref: '#/components/schemas/InvalidToolCall'
          type: array
          title: Invalid Tool Calls
        usage_metadata:
          anyOf:
          - $ref: '#/components/schemas/UsageMetadata'
          - type: 'null'
        tool_call_chunks:
          items:
            $ref: '#/components/schemas/ToolCallChunk'
          type: array
          title: Tool Call Chunks
        chunk_position:
          anyOf:
          - type: string
            const: last
          - type: 'null'
          title: Chunk Position
      additionalProperties: true
      type: object
      required:
      - content
      title: AIMessageChunk
      description: Message chunk from an AI (yielded when streaming).
    RequestBodyUpdateMessageApi:
      properties:
        thread_id:
          type: string
          title: Thread Id
          description: Thread ID of the chat, used in the checkpointer to find the conversation
        message:
          oneOf:
          - $ref: '#/components/schemas/AIMessage'
          - $ref: '#/components/schemas/HumanMessage'
          - $ref: '#/components/schemas/ChatMessage'
          - $ref: '#/components/schemas/SystemMessage'
          - $ref: '#/components/schemas/FunctionMessage'
          - $ref: '#/components/schemas/ToolMessage'
          - $ref: '#/components/schemas/AIMessageChunk'
          - $ref: '#/components/schemas/HumanMessageChunk'
          - $ref: '#/components/schemas/ChatMessageChunk'
          - $ref: '#/components/schemas/SystemMessageChunk'
          - $ref: '#/components/schemas/FunctionMessageChunk'
          - $ref: '#/components/schemas/ToolMessageChunk'
          title: Message
          description: Langgraph message object
      type: object
      required:
      - thread_id
      - message
      title: RequestBodyUpdateMessageApi
    SimpleMessage:
      properties:
        content:
          type: string
          title: Content
          description: Langgraph message content
      type: object
      required:
      - content
      title: SimpleMessage
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FunctionMessageChunk:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: FunctionMessageChunk
          title: Type
          default: FunctionMessageChunk
        name:
          type: string
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      additionalProperties: true
      type: object
      required:
      - content
      - name
      title: FunctionMessageChunk
      description: Function Message chunk.
    SystemMessage:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: system
          title: Type
          default: system
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      additionalProperties: true
      type: object
      required:
      - content
      title: SystemMessage
      description: "Message for priming AI behavior.\n\nThe system message is usually passed in as the\
        \ first of a sequence\nof input messages.\n\nExample:\n    ```python\n    from langchain_core.messages\
        \ import HumanMessage, SystemMessage\n\n    messages = [\n        SystemMessage(content=\"You\
        \ are a helpful assistant! Your name is Bob.\"),\n        HumanMessage(content=\"What is your\
        \ name?\"),\n    ]\n\n    # Define a chat model and invoke it with the messages\n    print(model.invoke(messages))\n\
        \    ```"
    ToolCall:
      properties:
        name:
          type: string
          title: Name
        args:
          additionalProperties: true
          type: object
          title: Args
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        type:
          type: string
          const: tool_call
          title: Type
      additionalProperties: true
      type: object
      required:
      - name
      - args
      - id
      title: ToolCall
      description: "Represents an AI's request to call a tool.\n\nExample:\n    ```python\n    {\"name\"\
        : \"foo\", \"args\": {\"a\": 1}, \"id\": \"123\"}\n    ```\n\n    This represents a request to\
        \ call the tool named `'foo'` with arguments\n    `{\"a\": 1}` and an identifier of `'123'`.\n\
        \n!!! note \"Factory function\"\n\n    `tool_call` may also be used as a factory to create a `ToolCall`.\
        \ Benefits\n    include:\n\n    * Required arguments strictly validated at creation time"
    ToolMessageChunk:
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - type: string
              - additionalProperties: true
                type: object
            type: array
          title: Content
        additional_kwargs:
          additionalProperties: true
          type: object
          title: Additional Kwargs
        response_metadata:
          additionalProperties: true
          type: object
          title: Response Metadata
        type:
          type: string
          const: ToolMessageChunk
          title: Type
          default: ToolMessageChunk
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        tool_call_id:
          type: string
          title: Tool Call Id
        artifact:
          title: Artifact
        status:
          type: string
          enum:
          - success
          - error
          title: Status
          default: success
      additionalProperties: true
      type: object
      required:
      - content
      - tool_call_id
      title: ToolMessageChunk
      description: Tool Message chunk.
    InputTokenDetails:
      properties:
        audio:
          type: integer
          title: Audio
        cache_creation:
