  /noCo/api/v2/workspaces/{workspaceId}/extraction/{id}/{elementType}/{elementId}/run:
    post:
      tags:
      - extraction-controller
      operationId: triggerExtraction
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: elementType
        in: path
        required: true
        schema:
          type: string
          enum:
          - FILE
          - FOLDER
          - COLUMN
      - name: elementId
        in: path
        required: true
        schema:
          type: string
      - name: extractOnlyNew
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionTriggerRequestDTO'
      responses:
        '400':
          description: Bad Request
          content:
