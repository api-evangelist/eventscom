            '*/*':
              schema:
                $ref: '#/components/schemas/SaasxlResponseDTOObject'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedPermissionsDTO'
  /noCo/api/v1/sharedPermissions/{sharedItemId}:
    get:
      tags:
      - shared-permissions-controller
      operationId: getSharedPermission
      parameters:
      - name: sharedItemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '400':
          description: Bad Request
          content:
