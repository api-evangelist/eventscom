components:
  schemas:
    ErrorMessage:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        requestId:
          type: string
        message:
          type: object
        details:
          type: object
        errorCodes:
          type: array
          items:
            type: string
    SaasxlResponseDTOObject:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ErrorMessage'
        data:
          type: object
    SharedPermissionsDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
        sharedItemId:
          type: integer
          format: int64
        sharedEntityType:
          type: string
          enum:
          - COMPANY
          - DOMAIN
          - WORKBOOK
        entityValues:
          type: array
          items:
            type: string
        workbookColName:
          type: string
  securitySchemes:
    s_jwt:
      type: http
      description: Jwt Token
      scheme: bearer
      bearerFormat: JWT
